<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
    <div class="container">
        <form action="dashboard.html" method="get">
            <fieldset>

            <h1>Dev<span class="luces">Plataform</span></h1>
            <p class="textoP">Ingresa tus credenciales para poder acceder al panel de control.</p>

                <label for="correo">Correo Electronico * </label>
                <input type="email" name="correo" id="correoo" required placeholder="ejemplo@correo.com">

                <label for="contraseña" >Contraseña * </label>
                <input type="password" name="contraseña" id="contraseña" required >

                <label for="rol">Rol de desarrollo * </label>
                <select name="desplegable" id="rol" required>
                    <option value="" aria-placeholder="seleccione una opcion">seleccione una opcion</option>
                    <option value="desarrolladorFronted">Desarrollador Fronted</option>
                    <option value="desarrolladorBakend">Desarrollador Bakend</option>
                    <option value="desarrolladorFullstack">Desarrollador FullStack</option>
                </select>
                <div class="checkbox">
                <input type="checkbox" id="checkbox" required>Acepto los terminos de servicio y privacidad.
                </div>

               <a href="dashboard.html" class="btn-ingresar">Ingresar al DashBoard</a>


            </fieldset>
        </form>
    </div>
</body>
</html>
